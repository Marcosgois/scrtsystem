# zControl Desk — domínios de produção e desenvolvimento, atrás do Cloudflare.
# Destino: /etc/nginx/conf.d/zcontroldesk-domains.conf
#
#   sudo install -m 644 deploy/nginx-domains.conf /etc/nginx/conf.d/zcontroldesk-domains.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pressupõe o Cloudflare em modo proxy (nuvem laranja) e SSL/TLS = Full (strict).
# O TLS entre o Cloudflare e esta origem usa um Cloudflare Origin Certificate, cuja
# chave privada foi gerada AQUI e nunca saiu do servidor:
#   /etc/pki/nginx/zcd-origin.crt   (assinado pelo Cloudflare — público)
#   /etc/pki/nginx/zcd-origin.key   (privado, 600 root)
#
# O IP real do visitante chega em CF-Connecting-IP (o $remote_addr é o Cloudflare).
# É esse valor que vai para a trilha de auditoria — e depois que o firewall só
# aceitar as faixas do Cloudflare, ninguém consegue forjá-lo batendo direto.

# ── Redireciona HTTP → HTTPS para os dois nomes ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zcontroldesk.linuxone.com.br dev.zcontroldesk.linuxone.com.br;
    return 301 https://$host$request_uri;
}

# ── PRODUÇÃO ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zcontroldesk.linuxone.com.br;

    ssl_certificate     /etc/pki/nginx/zcd-origin.crt;
    ssl_certificate_key /etc/pki/nginx/zcd-origin.key;

    client_max_body_size 32m;
    client_body_timeout  120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    server_tokens off;

    access_log /var/log/nginx/zcontroldesk.access.log;
    error_log  /var/log/nginx/zcontroldesk.error.log warn;

    # Cabeçalhos de segurança (achado do assessment). HSTS só faz sentido agora
    # que o domínio é sempre HTTPS. includeSubDomains cobre o dev também.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }
}

# ── DESENVOLVIMENTO ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.zcontroldesk.linuxone.com.br;

    ssl_certificate     /etc/pki/nginx/zcd-origin.crt;
    ssl_certificate_key /etc/pki/nginx/zcd-origin.key;

    client_max_body_size 32m;
    client_body_timeout  120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    server_tokens off;

    access_log /var/log/nginx/zcontroldesk-dev.access.log;
    error_log  /var/log/nginx/zcontroldesk-dev.error.log warn;

    # Camada extra: o dev tem cópia dos dados de prod, então não fica aberto —
    # pede usuário/senha (basic-auth) ANTES do login da aplicação. Um upgrade
    # natural aqui é trocar por Cloudflare Access (SSO por e-mail).
    auth_basic "zControl Desk — ambiente de desenvolvimento";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }
}
