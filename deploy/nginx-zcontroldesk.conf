# =============================================================================
# IBM Z Control Desk — proxy reverso nginx
# Destino no servidor: /etc/nginx/conf.d/zcontroldesk.conf
#
#   sudo install -m 644 -o root -g root \
#     deploy/nginx-zcontroldesk.conf /etc/nginx/conf.d/zcontroldesk.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# -----------------------------------------------------------------------------
# TRÊS COISAS QUE ESTE ARQUIVO PRESSUPÕE:
#
# 1) A aplicação escuta em 127.0.0.1:8008 (PORT=8008 e HOST=127.0.0.1 no
#    /etc/zcontroldesk.env). A porta NÃO é arbitrária: com SELinux Enforcing, o
#    nginx roda no domínio httpd_t e só conecta em portas rotuladas http_port_t.
#    Neste RHEL 9 esse rótulo cobre 80, 81, 443, 488, 8008, 8009, 8443 e 9000 —
#    note que 8080 NÃO está na lista, e que a 3000 é ntop_port_t.
#    Com a 8008 nenhum ajuste de SELinux é necessário. Se um dia mudar para uma
#    porta fora da lista, a alternativa CIRÚRGICA é rotular só aquela porta:
#      sudo semanage port -m -t http_port_t -p tcp <porta>
#    e não o boolean httpd_can_network_connect, que libera o nginx para conectar
#    em qualquer lugar da rede.
#    Diagnóstico quando dá 502: o errno diz tudo.
#      13 (Permission denied)  -> SELinux, é a porta/rótulo
#      111 (Connection refused)-> o Node está caído ou noutra porta
#
# 2) O bloco "server { listen 80; ... }" do /etc/nginx/nginx.conf do RPM foi
#    comentado (cópia em /etc/nginx/nginx.conf.orig). Ele não tem default_server,
#    então não conflita — mas, deixado ativo, atende o IP com a página de
#    boas-vindas do RHEL para qualquer Host que não case aqui.
#
# 3) O TLS é OBRIGATÓRIO, não um refinamento. Com NODE_ENV=production o cookie de
#    sessão sai com o atributo Secure (src/auth.js), e o navegador DESCARTA um
#    cookie Secure recebido por HTTP — o login falha sem mensagem nenhuma.
#    O bloco 443 abaixo é escrito pelo certbot (--nginx). Ao editar à mão, atenção:
#    "http2 on;" só existe a partir do nginx 1.25.1; no 1.20 do RHEL 9 a sintaxe
#    é "listen 443 ssl http2;", senão o nginx -t falha com unknown directive.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # O nome nip.io resolve para o próprio IP e é o que permite um certificado
    # de verdade do Let's Encrypt sem depender de DNS próprio. O default_server
    # acima garante que o acesso pelo IP cru também caia aqui.
    server_name 148.100.74.249.nip.io _;

    # ---- Tamanho de corpo ---------------------------------------------------
    # O padrão do nginx é 1 MB. Com ele, o upload de SCRT/contrato morre em
    # "413 Request Entity Too Large" ANTES de chegar no Node — e o log da
    # aplicação não registra nada, o que faz procurar no lugar errado.
    # A aplicação aceita 25 MB nas duas portas de entrada (express.json e multer);
    # 32m dá folga para o overhead do multipart sem virar convite a upload
    # gigante: acima de 25 MB quem barra é a aplicação, com erro decente.
    client_max_body_size 32m;
    client_body_timeout  120s;

    # ---- Tempos -------------------------------------------------------------
    # O padrão de proxy_read_timeout é 60s. Parse de SCRT e merge mensal de
    # vários sites passam disso e viram 504 no meio do trabalho.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    access_log /var/log/nginx/zcontroldesk.access.log;
    error_log  /var/log/nginx/zcontroldesk.error.log warn;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8008;

        # HTTP/1.1 + Connection vazio habilita keep-alive com o upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host original: sem ele o Node recebe "127.0.0.1:8008" e qualquer
        # redirect absoluto que a aplicação gerar aponta para o lugar errado.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Aqui é $remote_addr de propósito, e NÃO $proxy_add_x_forwarded_for
        # (que ANEXA ao header que o cliente mandou). O src/logger.js confia no
        # primeiro elemento de X-Forwarded-For, e esse valor vai para a trilha de
        # auditoria de quem acessou o quê. Sobrescrever impede que o próprio
        # cliente escolha o IP que aparece no log.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Repassa erro do upstream em vez de mascarar com página do nginx.
        proxy_buffering off;
    }
}
